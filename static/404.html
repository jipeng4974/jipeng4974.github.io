<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; }
      main { max-width: 34em; padding: 2rem; text-align: center; }
      ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; justify-content: center; }
    </style>
    <script src="/js/language-redirect.js"></script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Redirecting to your preferred language…</p>
      <noscript>
        <p>JavaScript is unavailable. Choose a language:</p>
        <ul>
          <li><a href="/en/">English</a></li>
          <li><a href="/zh/">简体中文</a></li>
          <li><a href="/zh-trad/">繁體中文</a></li>
        </ul>
      </noscript>
    </main>
    <script>window.tdHandleMissingPage && window.tdHandleMissingPage();</script>
  </body>
</html>
