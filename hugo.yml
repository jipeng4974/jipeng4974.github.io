title: "Crafts & Passages"
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
defaultContentLanguage: en
defaultContentLanguageInSubdir: true

ignoreLogs:
  - warning-frontmatter-params-overrides # cSpell:disable-line

# Allow iframe-hosted custom themes to load during local previews.
# These headers are only used by `hugo server`; they do not affect generated production files.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'

outputs:
  home: [HTML, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

imaging:
  resampleFilter: CatmullRom # cSpell:disable-line

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: "Crafts & Passages"
    params:
      description: Writeups on systems, AI, math, and everything in between
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: 时俗工巧，鸿爪雪泥
    params:
      description: 关于系统、AI、数学与其他主题的随笔
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      links:
        user:
          - name: 随笔
            url: /zh/writeups/
            icon: fa-solid fa-pen-nib
            desc: 阅读全部文章
          - name: 标签
            url: /zh/tags/
            icon: fa-solid fa-tags
            desc: 按主题浏览随笔
          - name: 邮箱
            url: mailto:wjp4974@qq.com
            icon: fa-solid fa-envelope
            desc: 给我发邮件
        developer:
          # - name: 项目  # restore when the projects section is re-enabled
          #   url: /zh/projects/
          #   icon: fa-solid fa-diagram-project
          #   desc: 正在进行的项目
          - name: 关于
            url: /zh/about/
            icon: fa-solid fa-user
            desc: 关于我
  zh-trad:
    label: 繁體中文
    locale: zh-Hant
    weight: 3
    title: 時俗工巧，鴻爪雪泥
    params:
      description: 關於系統、AI、數學與其他主題的隨筆
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
      links:
        user:
          - name: 隨筆
            url: /zh-trad/writeups/
            icon: fa-solid fa-pen-nib
            desc: 閱讀全部文章
          - name: 標籤
            url: /zh-trad/tags/
            icon: fa-solid fa-tags
            desc: 按主題瀏覽隨筆
          - name: 郵箱
            url: mailto:wjp4974@qq.com
            icon: fa-solid fa-envelope
            desc: 給我發郵件
        developer:
          # - name: 項目  # restore when the projects section is re-enabled
          #   url: /zh-trad/projects/
          #   icon: fa-solid fa-diagram-project
          #   desc: 正在進行的項目
          - name: 關於
            url: /zh-trad/about/
            icon: fa-solid fa-user
            desc: 關於我

markup:
  tableOfContents:
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]
    renderer:
      unsafe: true
  highlight:
    noClasses: false # Required for dark-mode

params:
  logo: favicon.svg

  hugoMinVersion: &hugoMinVersion 0.160.1
  productionURL: &productionURL https://wujipeng.com
  copyright:
    authors: 'Wu Jipeng • All rights reserved.'
    from_year: 2022
    to_year: present
  github_subdir: ''
  email: wjp4974@qq.com
  github_project_repo: https://github.com/jipeng4974
  # BibTeX data for the page actions ("Copy BibTeX" in the TOC rail). The cite
  # key is <key_prefix>-<page slug>, e.g. wujipeng-dspark. Overridable per
  # language under languages.<lang>.params.citation — e.g. to put a Chinese
  # author name on the zh site.
  citation:
    author: Wu Jipeng
    key_prefix: wujipeng
  # Blog list cards and writeup article meta rows use a short, abbreviated
  # English date (no weekday); zh overrides this under languages.zh.params.
  time_format_blog: Jan. 2, 2006
  time_format_default: January 2, 2006
  rss_sections: [writeups]
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false
  page_width: normal
  comments:
    enable: false
  ui:
    # The site is shallow (section -> page), so breadcrumbs are disabled
    # globally; the shell sidebar/topbar already communicates location.
    breadcrumb_disable: true
    quick_links: [writeups, works, photos, gears, about] # add `projects` back when the projects section is re-enabled
    page_context_menu:
      enable: true
      links: []
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_width_min: 220
    sidebar_width_max: 480
    sidebar_item_overflow: ellipsis
    sidebar_menu_truncate: 2000
    ul_show: 2
    scrollSpy:
      disable: true
    feedback:
      enable: false
    readingtime:
      enable: false
  links:
    user:
      - name: Writeups
        url: /writeups/
        icon: fa-solid fa-pen-nib
        desc: Read all the writeups
      - name: Tags
        url: /tags/
        icon: fa-solid fa-tags
        desc: Browse writeups by topic
      - name: Email
        url: mailto:wjp4974@qq.com
        icon: fa-solid fa-envelope
        desc: Send me an email
    developer:
      # - name: Projects  # restore when the projects section is re-enabled
      #   url: /projects/
      #   icon: fa-solid fa-diagram-project
      #   desc: Things I build and maintain
      - name: About
        url: /about/
        icon: fa-solid fa-user
        desc: About me

  plantuml:
    enable: true
    theme: default
    svg_image_url: https://www.plantuml.com/plantuml/svg/
    svg: false
  print:
    disable_toc: false
  markmap:
    enable: true
  drawio:
    enable: true
    drawio_server: https://embed.diagrams.net/

baseURL: *productionURL

taxonomies:
  tag: tags

# ---------------------------------------------------------------------------
# Hidden sections: publications and projects are kept in the repo but not
# built into the site (no papers / OSS projects to publish for now).
# To re-enable: delete this cascade block, restore `projects` in
# params.ui.quick_links, and restore the commented-out Projects link entries
# under params.links.developer (en) and languages.zh.params.links.developer.
cascade:
  - _target: { path: /projects }
    build: { list: never, render: never }
  - _target: { path: /projects/** }
    build: { list: never, render: never }
  - _target: { path: /publications }
    build: { list: never, render: never }
  - _target: { path: /publications/** }
    build: { list: never, render: never }

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: *hugoMinVersion
  mounts:
    # English sources and colocated .zh.md translations.  The .zh-trad.md
    # tree is generated from the latter by scripts/generate-zh-trad.py before
    # every Hugo build.
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
    - source: tmp/content-zh-trad
      target: content
      sites: { matrix: { languages: [zh-trad] } }
