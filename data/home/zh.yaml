# 首页区块：可删除、重排或禁用任意条目。
sections:
  - hero
  - gallery
  - cta

hero:
  eyebrow: jipeng4974
  title: 为**无结构的现实**赋予结构。
  desc: 关于系统、AI、数学，以及其他一切拒绝被结构化的主题的个人随笔。
  note: 本站由 Hugo 与 OINK 主题构建。
  actions:
    - label: 阅读随笔
      url: writeups/
      icon: fa-solid fa-pen-nib
      style: primary
    - label: 关于我
      url: about/
      icon: fa-solid fa-user
      style: ghost

gallery:
  eyebrow: 栏目
  title: 这里有什么
  desc: 六个一级标签页，互联网上的一个安静角落。
  columns: 3
  link_label: 打开
  items:
    - title: 随笔
      badge: 博客
      icon: fa-solid fa-pen-nib
      desc: 关于系统、AI、数学与哲学的长文笔记。
      url: writeups/
    - title: 游戏
      badge: 演示
      icon: fa-solid fa-gamepad
      desc: 小游戏与引擎实验。
      url: games/
    - title: 摄影
      badge: 相册
      icon: fa-solid fa-camera
      desc: 有值得展示的内容时，精选照片会放在这里。
      url: photographs/
    - title: 项目
      badge: 工作
      icon: fa-solid fa-diagram-project
      desc: 我在构建或维护的东西。
      url: projects/
    - title: 出版物
      badge: 论文
      icon: fa-solid fa-scroll
      desc: 论文与正式写作。
      url: publications/
    - title: 关于
      badge: 我
      icon: fa-solid fa-user
      desc: 我是谁，以及如何联系到我。
      url: about/

cta:
  title: 从随笔开始。
  desc: 笔记才是本站的重点，其余皆是脚手架。
  label: 浏览随笔
  url: writeups/
  style: primary

footer:
  brand:
    name: jipeng4974
    tagline: Impose Structure on Unstructured Realities
    slogan: 个人站点——随笔、项目与演示
  columns:
    - title: 内容
      links:
        - { label: 随笔, url: writeups/ }
        - { label: 标签, url: tags/ }
        - { label: 出版物, url: publications/ }
    - title: 更多
      links:
        - { label: 游戏, url: games/ }
        - { label: 摄影, url: photographs/ }
        - { label: 项目, url: projects/ }
    - title: 关于
      links:
        - { label: 关于我, url: about/ }
        - {
            label: GitHub,
            url: 'https://github.com/jipeng4974',
            external: true,
          }
