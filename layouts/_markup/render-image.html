{{- $isPhoto := eq .Page.Section "photos" -}}
{{- if $isPhoto -}}
  {{- /* Photos pages reference many large JPEGs on R2. Every image is
         wrapped in a fixed-ratio placeholder frame with its real URL in
         data-src; assets/js/photo-gallery.js fetches them on demand. */ -}}
<span class="photo-frame photo-frame--pending"><img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
     data-src="{{ .Destination | safeURL }}"
     alt="{{ .Text }}"
     {{- with .Title }} title="{{ . }}"{{ end }}
     class="photo-fit-screen" decoding="async"><span class="photo-frame__status" aria-hidden="true"></span></span>
{{- else -}}
<img src="{{ .Destination | safeURL }}"
     alt="{{ .Text }}"
     {{- with .Title }} title="{{ . }}"{{ end -}}>
{{- end -}}
