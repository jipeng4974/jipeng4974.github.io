{{- if or .PrevInSection .NextInSection -}}
<ul class="article-pager list-unstyled d-flex justify-content-between align-items-center mb-0 pt-5">
  {{- with .PrevInSection }}
  <li>
    <a href="{{ .RelPermalink }}" class="btn btn-primary"
      aria-label="{{ T "ui_pager_prev" }} - {{ .Title }}">{{ T "ui_pager_prev" }}</a>
  </li>
  {{- end }}
  {{- with .NextInSection }}
  <li>
    <a href="{{ .RelPermalink }}" class="btn btn-primary"
      aria-label="{{ T "ui_pager_next" }} - {{ .Title }}">{{ T "ui_pager_next" }}</a>
  </li>
  {{- end }}
</ul>
{{- end -}}
